[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "py-markdown-sanitizer"
version = "0.3.0"
description = "Block zero-click markdown image exfiltration with a URL allow-list"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Dawson Canby" }]
keywords = ["markdown", "sanitizer", "security"]
dependencies = [
    "mistune>=3.0",
    "beautifulsoup4>=4.12",
    "markdownify>=0.13",
]

[project.urls]
Homepage = "https://github.com/delayedloris/py-markdown-sanitizer"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
