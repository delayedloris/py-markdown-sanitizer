[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "py-markdown-sanitizer"
version = "0.2.0"
description = "Block zero-click markdown image exfiltration with a URL allow-list"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Dawson Canby" }]
keywords = ["markdown", "sanitizer", "security"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/delayedloris/py-markdown-sanitizer"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
